# SPDX-License-Identifier: Apache-2.0

description: |
  IT8801 register emulation over I2C target.
  Emulates the subset of the ITE IT8801 register interface that the EC's
  stock IT8801 ioexpander driver needs (vendor ID, SOVR for 3 ports, CR,
  and KSO/KSI stubs). Board code receives a callback on SOVR bit
  transitions and decides what each bit does physically.

compatible: "zmk,i2c-target-it8801"

include: i2c-device.yaml

properties:
  sovr0-init:
    type: int
    default: 0xFF
    description: Initial value of SOVR(0) shadow (host reads this at init).
  sovr1-init:
    type: int
    default: 0xFF
    description: Initial value of SOVR(1) shadow.
  sovr2-init:
    type: int
    default: 0xFF
    description: Initial value of SOVR(2) shadow.
