CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# 16-bit consumer usages so we can transmit AL_* keycodes (C_AL_CCC = 0x183, etc.)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Enable shell for debugging over UART
# Turn off for production firmware
CONFIG_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C=y
CONFIG_I2C_STM32_INTERRUPT=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_HID_TARGET=y
CONFIG_I2C_SHELL=y
