# Minimal config for inputmodule bringup — override shield defaults
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_GPIO_SHELL=n
CONFIG_I2C_SHELL=n

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Enable HID LED indicators (Caps Lock, Num Lock, Scroll Lock from host)
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_I2C=y
CONFIG_I2C_STM32_INTERRUPT=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_HID_TARGET=y
CONFIG_I2C_IT8801_TARGET=y

# Use printk directly instead of logging
CONFIG_PRINTK=y

# Prevent the MCU from entering Stop mode during idle — Stop mode
# gates AHB clocks and disables I2C/GPIO, breaking host communication
# until the next wake event. Plain WFI (Sleep mode) keeps peripherals
# clocked and I2C responsive.
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# Vendor command channel for BIOS-controlled settings and info queries.
CONFIG_ZMK_HID_FRAMEWORK_VENDOR_COMMAND=y

# NVS + Settings for persistent state (Fn Lock).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Runtime-writable keymap for the Fn/LCtrl swap (RAM-only, never saved).
# CRC16 local IDs avoid settings-storage writes.
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y
# Longest layer display-name is 25 chars ("FM Layer (Temp FN unlock)").
CONFIG_ZMK_KEYMAP_LAYER_NAME_MAX_LEN=32
