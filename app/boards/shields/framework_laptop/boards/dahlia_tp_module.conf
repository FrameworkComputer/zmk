# Minimal config for inputmodule bringup — override shield defaults
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_GPIO_SHELL=n
CONFIG_I2C_SHELL=n

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Enable HID LED indicators (Caps Lock, Num Lock, Scroll Lock from host)
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_I2C=y
CONFIG_I2C_STM32_INTERRUPT=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_HID_TARGET=y
CONFIG_I2C_IT8801_TARGET=y

# Use printk directly instead of logging
CONFIG_PRINTK=y

# Prevent the MCU from entering Stop mode during idle — Stop mode
# gates AHB clocks and disables I2C/GPIO, breaking host communication
# until the next wake event. Plain WFI (Sleep mode) keeps peripherals
# clocked and I2C responsive.
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# NVS + Settings for persistent state (Fn Lock).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
